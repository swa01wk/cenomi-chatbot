[project]
name = "cenomi-concierge"
version = "0.1.0"
description = "Cenomi Mall Concierge — AI-powered mall assistant platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "langgraph>=0.3",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "httpx>=0.28",
    "python-dotenv>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
]
redis = [
    "redis[asyncio]>=5.0",
]

[tool.setuptools.packages.find]
include = ["app*", "guardrails*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
