services:

  # ──────────────────────────────────────────────────────────────────────────
  # Redis — session persistence + optional LangGraph checkpointer store
  # ──────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cenomi_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────────────────
  # Backend — Cenomi concierge FastAPI service
  # ──────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cenomi_backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override Redis URL to use Docker internal DNS (service name 'redis')
      BACKEND_REDIS_URL: redis://redis:6379/0
      # Multi-mall LRU cache: max malls held in Python RAM simultaneously
      BACKEND_MALL_CACHE_SIZE: 5
      # TTL (seconds) for serialized MallContextLoader in Redis Tier 2 (1 hour)
      BACKEND_MALL_CTX_REDIS_TTL: 3600
      # Vector store: Chroma persisted to the shared data volume
      BACKEND_VECTOR_STORE_TYPE: chroma
      BACKEND_CHROMA_PERSIST_DIR: data/chroma
      # Redis vector search result cache TTL (seconds)
      BACKEND_VECTOR_CACHE_TTL: 900
    volumes:
      # Mount data directory so canonical data, Chroma DB, evaluations, and
      # feedback all persist outside the container across restarts.
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  redis_data:
    driver: local
